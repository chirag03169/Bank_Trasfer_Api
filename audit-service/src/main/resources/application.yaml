
spring:
  application:
    name: audit-service

  datasource:
    url: jdbc:mysql://localhost:3306/audit_db?useSSL=false&serverTimezone=UTC
    username: root
    password: Tanaji@123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      group-id: audit-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

      properties:
        "[spring.deserializer.value.delegate.class]": org.springframework.kafka.support.serializer.JsonDeserializer
        "[spring.json.trusted.packages]": "com.example.audit_service.consumer"
        "[spring.json.value.default.type]": "com.example.audit_service.consumer.PaymentEvent"
        "[spring.json.use.type.headers]": false

server:
  port: 8082

logging:
  level:
    com.example.audit_service: INFO
    org.springframework.kafka: INFO
    org.hibernate.SQL: DEBUG
