
spring:
  application:
    name: notification-service-bank

  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

      properties:
        "[spring.deserializer.value.delegate.class]": org.springframework.kafka.support.serializer.JsonDeserializer
        "[spring.json.trusted.packages]": "com.example.notification_service_bank.consumer"
        "[spring.json.value.default.type]": "com.example.notification_service_bank.consumer.PaymentEvent"
        "[spring.json.use.type.headers]": false

server:
  port: 8083

logging:
  level:
    com.example.notification_service_bank: INFO
    org.springframework.kafka: INFO
